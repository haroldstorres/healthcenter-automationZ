}
// work out body system, hover key and label for one part
function dh3PartInfo(name,e){

  if(e.layer==='skeleton'){info.sys='skel';return info}
  if(e.layer==='muscles'){info.sys=e.group==='diaphragm'?'resp':'musc';return info}
  if(e.layer==='nerves'){info.sys='nerv';if(e.cat==='brain')pick('brain',DH3_ORGAN_LABELS.brain);return info}
  if(e.group==='reproductive'||e.mat==='reproductive'){info.sys='repr';return info}

    case 'heart':info.sys='circ';pick('heart',DH3_ORGAN_LABELS.heart);break;
    case 'lung':info.sys='resp';pick('lung'+e.side,cap(e.side)+'lung');break;
    case 'airway':{info.sys='resp';const k=/trachea/i.test(name)?'trachea':/bronch/i.test(name)?'bronchi':'larynx';pick(k,DH3_ORGAN_LABELS[k]);break}

      info.sys='dige';pick(e.mat,DH3_ORGAN_LABELS[e.mat]);break;
    case 'kidney':info.sys='urin';pick('kidney'+e.side,cap(e.side)+'kidney & ureter');break;
    case 'bladder':info.sys='urin';pick('bladder',DH3_ORGAN_LABELS.bladder);break;

      break;

  }

}

// load one layer file once, later calls reuse the same promise
function dh3LoadLayer(layer){
  if(DH3.layerState[layer])return DH3.layerState[layer];
  DH3.layerState[layer]=(async()=>{
    const gltf=await DH3.loader.loadAsync(DH3_MODEL_URL(DH3_LAYER_FILES[layer]));
    const rough={skeleton:.7,muscles:.6,organs:.45,vessels:.35,nerves:.5};
    const meshes=[];gltf.scene.traverse(m=>{if(m.isMesh)meshes.push(m)});
    meshes.forEach(m=>{
      const e=m.userData,name=e.name||m.name.replace(/_/g,' '),info=dh3PartInfo(name,e);
      Object.assign(m.userData,{grp:e.cat==='brain'?'organs':layer,sys:info.sys,key:info.key,label:info.label,head:info.head,sex:e.sex||''});
      if(layer==='skin'){
        // only skin and ear get the see-through shader, hair and lips stay hidden
        if(e.mat==='skin'){m.material=DH3.body.userData.skinMat;m.renderOrder=10;m.raycast=()=>{}}
        else{m.userData.hidden=true;m.visible=false}
        return
      }
      let base=parseInt(dh3ColorOf(name,e),16);
      const fibres=layer==='muscles'&&e.mat==='muscle';
      if(fibres){
        // slightly different shade per muscle so they read as separate muscles
        let hash=0;for(const ch of name)hash=(hash*31+ch.charCodeAt(0))%997;
        base=new DH3.THREE.Color(0xca6350).offsetHSL(0,0,((hash%17)-8)/130).getHex()
      }
      m.userData.base=base;
      m.material=new DH3.THREE.MeshStandardMaterial({color:base,roughness:rough[layer]||.5,metalness:0});
      if(fibres)dh3AddFibres(m.material)
    });
    [...gltf.scene.children].forEach(c=>DH3.body.add(c));
    if(DH3.st==='ready'&&DH3.last)dh3Apply(...DH3.last);
    return true
  })().catch(err=>{console.warn('3D layer failed: '+layer,err);return null});
  return DH3.layerState[layer]
}
function dh3AddFibres(mat){

function dh3Rays(e,onlyOrgans){

function gwChart(p,pts,c){
  const W=320,H=210,L=32,R=8,T=10,B=26,sx=p.sex==='M'?'M':'F',TB=c.T[sx],ms=c.M,top=Math.max(...TB.map(r=>r[4]),...pts.map(x=>x.v))+(c.step/2),lo=c.min,x=m=>L+(W-L-R)*m/60,y=w=>T+(H-T-B)*(1-(w-lo)/(top-lo));

  let gy='';for(let w=Math.ceil((lo+1)/c.step)*c.step;w<top;w+=c.step)gy+=`<line x1="${L}" x2="${W-R}" y1="${y(w)}" y2="${y(w)}" stroke="var(--bd)"/><text x="${L-4}" y="${y(w)+3}" text-anchor="end" font-size="10" fill="currentColor">${w}</text>`;

  if(pts.length){const q=pts[pts.length-1],r=gwInt(ms,TB,q.m);if(r){const dn=q.v<r[0],up=q.v>r[4],pv=pts.length>1?pts[pts.length-2]:null;st=`<b>Latest:</b> ${q.v} ${c.u} on ${E(q.d)} (${Math.round(q.m)} months). `+(dn?`<span class="tg er">Below the 3rd percentile</span> ${c.lo}`:up?`<span class="tg wa">Above the 97th percentile</span> ${c.hi}`:'<span class="tg ok">Within the 3rd to 97th percentile</span>')+(pv?` Change since ${E(pv.d)}: ${(q.v-pv.v>=0?'+':'')+(q.v-pv.v).toFixed(1)} ${c.u}.`:'')}}
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;height:auto" role="img" aria-label="${c.title} chart with WHO percentile curves">${grid}${band(0,1,'rgba(180,35,24,.10)')}${band(1,3,'rgba(11,122,124,.10)')}${band(3,4,'rgba(180,120,0,.10)')}${line(0)}${line(2)}${line(4)}${dots}</svg><div style="font-size:12px;color:var(--mu)">Curves: 3rd, 50th (solid) and 97th percentile, WHO Child Growth Standards, ${p.sex==='M'?'boys':'girls'}. Dots: recorded ${c.u==='kg'?'weights':'measurements'}.${c.foot||''}</div><p style="margin:8px 0 0">${st}</p>`

/* Station queues (Pharmacy, Lab, Immunization): call patients on the waiting-area display */
const SROLE={pharmacy:['pharmacist'],lab:['medtech'],imm:['midwife','doctor']},stOn=()=>['pharmacist','medtech'].includes(U.role);
const stCard=k=>SROLE[k].includes(U.role)?`<div class="cd ov"><h3 style="margin-top:0">${STN[k]} queue</h3><div id="sq-${k}">${stList(k)}</div></div>`:'';
function stList(k){

  if(!l.length)return '<p style="color:var(--mu)">No one is waiting here.</p>';

async function stCall(id,el){
  const x=Q.find(e=>e.id===id);if(!x||isC(x)||!SROLE[x.station]||!SROLE[x.station].includes(U.role))return;
  try{
    if(x.status!=='in-consult')await updateDoc(doc(db,'queue',id),{status:'in-consult',by:U.uid,byName:U.name,startedAt:serverTimestamp()});
    await setDoc(doc(db,'queueDisplay',id),{day:x.day,num:x.num,status:'in-consult',room:null,station:x.station,route:x.route||[],calledAt:serverTimestamp()},{merge:true});
    if(el){const t0=el.textContent;el.textContent='Called';setTimeout(()=>{el.textContent=t0},1500)}
  }catch(e){sAlert(e.code==='permission-denied'?'You do not have permission to call this patient.':'Could not call the patient. Check your connection.')}
}
// No-show: the patient was called but did not come. Put them back in the station's waiting list and clear them from the "Now serving" card.
async function stBack(id){
  const x=Q.find(e=>e.id===id);if(!x||isC(x)||!SROLE[x.station]||!SROLE[x.station].includes(U.role)||x.status!=='in-consult')return;
  if(!await sConfirm('Return '+x.name+' to the waiting list of '+(STN[x.station]||x.station)+'?','Return to waiting list?','Return',0))return;
  try{
    await updateDoc(doc(db,'queue',id),{status:'waiting',by:null,byName:null});
    await setDoc(doc(db,'queueDisplay',id),{day:x.day,num:x.num,status:'waiting',room:null,station:x.station,route:x.route||[]},{merge:true});
    await lg('Station returned to waiting '+x.station+' '+id)
  }catch(e){sAlert(e.code==='permission-denied'?'You do not have permission to update this patient.':'Could not save. Check your connection.')}
}
async function stDone(id){
  const x=Q.find(e=>e.id===id);if(!x||isC(x)||!SROLE[x.station]||!SROLE[x.station].includes(U.role))return;
  const r=x.route||[],nx=r[0],rest=r.slice(1);
  if(!await sConfirm('Finish '+x.name+' at '+(STN[x.station]||x.station)+(nx?' and send to '+(STN[nx]||nx)+'?':'?'),'Mark as done?','Done',0))return;
  try{
    await updateDoc(doc(db,'queue',id),nx?{status:'waiting',station:nx,route:rest,by:null,byName:null}:{status:'done'});
    await setDoc(doc(db,'queueDisplay',id),nx?{day:x.day,num:x.num,status:'waiting',room:null,station:nx,route:rest,routedAt:serverTimestamp()}:{day:x.day,num:x.num,status:'done',room:null,doneAt:serverTimestamp()},{merge:true});
    await lg('Station done '+x.station+' '+id)

async function saveC(){
  const e=t=>{$('ce').textContent=t},g=i=>$(i).value.trim(),p=P.find(x=>x.id===cp);
  const num=(i,lo,hi,l)=>{const v=g(i);if(v==='')return null;const n=Number(v);if(!isFinite(n)||n<lo||n>hi)throw new Error(l+' looks wrong. Please check it.');return n};
  let vit;
  try{vit={bps:num('v1',40,300,'Systolic BP'),bpd:num('v2',20,200,'Diastolic BP'),t:num('v3',30,45,'Temperature'),pr:num('v4',20,250,'Pulse'),rr:num('v5',4,80,'Respiratory rate'),o2:num('v6',50,100,'SpO2'),wt:num('v7',0.3,400,'Weight'),ht:num('v8',20,260,'Height')}}catch(x){return e(x.message)}
  if(!ICDSEL.list.length)return e('Select at least one ICD-10 diagnosis.');
  if(!g('dx'))$('dx').value=ICDSEL.list[0].name;
  if(!g('cc')||!g('dx'))return e('Enter the chief complaint and the diagnosis.');
  const items=RXL.map(i=>({...i}));
  if(items.some(i=>!i.dose||!i.freq))return e('Each medicine needs a dose and a frequency.');
  const fu=g('fu1'),fun=g('fu2');
  if(fu&&(!/^\d{4}-\d{2}-\d{2}$/.test(fu)||isNaN(new Date(fu))||fu<=today()))return e('Pick a follow-up date after today, or clear it.');
  const ref=$('rf').checked?{to:g('rf1'),why:g('rf2'),urg:g('rf3')}:null;

  Object.keys(vit).forEach(k=>{if(vit[k]===null)delete vit[k]});
  const rx=items.map(i=>`${i.drug} ${i.dose}, ${i.freq}${i.dur?', '+i.dur:''}${i.qty?' (#'+i.qty+')':''}`).join('; ');
  $('cs2').disabled=true;e('');
  try{
    let route=[];const b=writeBatch(db),vr=doc(collection(db,'visits')),d=today();
    // The patient came back: close any earlier open follow-up for this patient.
    let oldFu=[];try{oldFu=(await getDocs(query(collection(db,'visits'),where('pid','==',p.id),where('fuOpen','==',true)))).docs}catch(x){}
    oldFu.forEach(o=>b.update(o.ref,{fuOpen:false,fuDoneBy:U.name,fuDoneAt:serverTimestamp()}));
    b.set(vr,{pid:p.id,pname:pn(p),d,cc:g('cc'),dx:g('dx'),icd:ICDSEL.list.map(c=>({code:c.code,name:c.name})),tx:g('tx'),rx,vitals:vit,referral:ref,...(ref?{refSt:'sent',refAt:d}:{}),...(fu?{fu,fuOpen:true,fun}:{}),by:U.uid,byName:U.name,role:U.role,at:serverTimestamp()});
    const awaiting=needApproval(items);
    if(items.length)b.set(doc(collection(db,'prescriptions')),{pid:p.id,pname:pn(p),vid:vr.id,d,rx,items,status:awaiting?'awaiting':'pending',by:U.uid,byName:U.name,at:serverTimestamp()});
    g('lt').split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>b.set(doc(collection(db,'labs')),{pid:p.id,pname:pn(p),vid:vr.id,d,test:t,status:'pending',by:U.uid,byName:U.name,at:serverTimestamp()}));
    const lts=g('lt').split(',').map(x=>x.trim()).filter(Boolean),sv=(k,a)=>{const el=$('sn-'+k);return el&&el.dataset.t?el.checked:a};
    route=['lab','imm','pharmacy'].filter(k=>sv(k,k==='lab'?lts.length>0:k==='pharmacy'?items.length>0:false));
    {const miss=[];if(items.length&&!route.includes('pharmacy'))miss.push('a prescription (Pharmacy)');if(lts.length&&!route.includes('lab'))miss.push('lab tests (Laboratory)');
      if(miss.length&&!await sConfirm('You added '+miss.join(' and ')+' but the patient is not being sent there. Save anyway?','Patient not sent','Save anyway',0)){$('cs2').disabled=false;return}}
    // Lab does not hold up the other stations: when the patient also goes to Pharmacy or Immunization, Laboratory gets its own queue entry (same number) and runs in parallel. Lab results reach the doctor later.
    const par=route.includes('lab')&&route.length>1,main=par?route.filter(k=>k!=='lab'):route;
    const labQ=(base,num)=>{const lr=doc(collection(db,'queue'));
      b.set(lr,{pid:p.id,name:base.name||pn(p),age:base.age!=null?base.age:age(p.dob),sex:base.sex||p.sex,reason:base.reason||g('cc'),day:base.day||today(),num,by:null,byName:null,at:serverTimestamp(),station:'lab',route:[],status:'waiting',room:null});
      b.set(doc(db,'queueDisplay',lr.id),{day:base.day||today(),num,status:'waiting',room:null,station:'lab',route:[],routedAt:serverTimestamp()},{merge:true})};
    if(cq){
      const qx=Q.find(e=>e.id===cq),rest=main.slice(1);
      b.update(doc(db,'queue',cq),main.length?{status:'waiting',station:main[0],route:rest,by:null,byName:null,room:null}:{status:'done'});
      if(qx)b.set(doc(db,'queueDisplay',cq),main.length?{day:qx.day,num:qx.num,status:'waiting',room:null,station:main[0],route:rest,routedAt:serverTimestamp()}:{day:qx.day,num:qx.num,status:'done',room:null,doneAt:serverTimestamp()},{merge:true});
      if(par&&qx)labQ(qx,qx.num)
    }else if(route.length){
      // Patient was seen without a queue entry (for example, back from the lab): give them a place in the next station's queue.
      await fetchQ();
      const ex=Q.find(e=>e.pid===p.id&&['waiting','in-consult'].includes(e.status)),rest=main.slice(1),f=main.length?{station:main[0],route:rest,status:'waiting',by:null,byName:null,room:null}:null;
      if(ex){if(f){b.update(doc(db,'queue',ex.id),f);b.set(doc(db,'queueDisplay',ex.id),{day:ex.day,num:ex.num,status:'waiting',room:null,station:main[0],route:rest,routedAt:serverTimestamp()},{merge:true})}else{b.update(doc(db,'queue',ex.id),{status:'done'});b.set(doc(db,'queueDisplay',ex.id),{day:ex.day,num:ex.num,status:'done',room:null,doneAt:serverTimestamp()},{merge:true})}
        if(par)labQ(ex,ex.num)}
      else{const num=Q.reduce((m,x)=>Math.max(m,x.num||0),0)+1;
        if(f){const qr=doc(collection(db,'queue'));
          b.set(qr,{pid:p.id,name:pn(p),age:age(p.dob),sex:p.sex,reason:g('cc'),day:today(),num,by:U.name,at:serverTimestamp(),...f});
          b.set(doc(db,'queueDisplay',qr.id),{day:today(),num,status:'waiting',room:null,station:main[0],route:rest,routedAt:serverTimestamp()},{merge:true})}
        if(par)labQ({},num)}
    }
    await b.commit();await lg('Consultation '+p.id+(ref?' (referral)':''));dClear();cp=null;cq=null;if(awaiting)sAlert('Saved. The prescription was sent to the doctor for approval before it goes to the pharmacy.');else sDone('The consultation was saved.'+(route.length?' The patient was sent to '+(par?main.map(k=>STN[k]).join(', then ')+' and Laboratory (at the same time)':route.map(k=>STN[k]).join(', then '))+'.':''),'Consultation saved');view(p.id,1)
  }catch(x){$('cs2').disabled=false;e(x.code==='permission-denied'?'You do not have permission to save consultations.':'Could not save. Check your connection and try again.')}
}

let RX=[],SK={},RXM={};
const RXT={ok:['ok','In stock'],low:['wa','Not enough'],out:['er','Out of stock'],nolist:['wa','Not in stock list']};
function rxLn(i){const k=SK[skey(i.drug||'')],n=Number(i.qty)||0,u=k?bUse(k):null;let st='ok';if(!k)st='nolist';else if(u<=0)st='out';else if(n>0&&u<n)st='low';return{k,n,u,st}}
const rxStLbl=r=>({pending:'Pending',awaiting:'Awaiting approval',rejected:'Rejected',dispensed:'Dispensed',partial:(r.results||[]).some(x=>x.st==='given'||x.given>0)?'Partly dispensed':'Not available'}[r.status]||r.status||'');
function rxFlag(r,withBtn){

  const l=(r.results||[]).map((x,k)=>x.st==='given'||!it[k]?'':`<div>${E(it[k].drug)}: ${x.st==='partial'?'only '+x.given+' of '+(it[k].qty||'?')+' given':'not available'}${x.note?' ('+E(x.note)+')':''}</div>`).join('');
  return `<div style="color:var(--er);font-size:13px;margin-top:4px"><b>Not fully dispensed</b>${l}${withBtn&&CROLES.includes(U.role)?`<button type="button" class="bt g" style="margin-top:6px" onclick="startC('${r.pid}')">Prescribe replacement</button>`:''}</div>`
}
async function rxFinish(id,res){
  const r=RX.find(x=>x.id===id);if(!r)return;
  const it=r.items||[],need={};
  it.forEach((i,k)=>{const g=res[k].given;if(i.drug&&g>0){const key=skey(i.drug);need[key]=(need[key]||0)+g}});
  const status=res.every(x=>x.st==='given')?'dispensed':'partial',lgs=[];
  fmBusy(true);
  try{
    await runTransaction(db,async tx=>{
      lgs.length=0;
      const ks=Object.keys(need).filter(k=>SK[k]),sn=await Promise.all(ks.map(k=>tx.get(doc(db,'stock',k))));
      ks.forEach((k,i)=>{if(sn[i].exists()){const d=sn[i].data();if(bUse(d)<need[k])throw new Error('stock');const np=bPack(bTake(bList(d),need[k]));tx.update(doc(db,'stock',k),{...np,at:serverTimestamp()});lgs.push({key:k,name:d.name,type:'out',reason:'Dispensed',note:'',qty:-need[k],before:bTot(d),after:np.qty,rx:id,d:today(),by:U.uid,byName:U.name})}});
      tx.update(doc(db,'prescriptions',id),{status,results:res,dispensedBy:U.name,dispensedAt:serverTimestamp()})
    });

    fmClose();await lg((status==='dispensed'?'Dispensed ':'Partly dispensed ')+id);
    sDone(status==='dispensed'?'The prescription was marked as dispensed.':'Saved. Medicines that were not fully given are flagged for the doctor.',status==='dispensed'?'Dispensed':'Partly dispensed');await loadPh()
  }catch(x){fmBusy(false);if(x.message==='stock'){fmClose();await loadPh();sAlert('The stock changed while you were working. Please review the prescription again.')}else sAlert(x.code==='permission-denied'?'You do not have permission to dispense.':'Could not update. Check your connection.')}
}
function rxDspOpen(id){

  const al=rxAlg2(r),body=(r.items||[]).map((i,k)=>{const x=rxLn(i),t=RXT[x.st],def=x.st==='ok'?'given':x.st==='low'?'partial':'none';
    return `<div class="cd" style="margin:0 0 10px;padding:12px"><b>${E(i.drug)}</b> ${E(i.dose)}, ${E(i.freq)}${i.dur?', '+E(i.dur):''} <span class="tg ${t[0]}">${t[1]}</span><div style="color:var(--mu);font-size:13px">Prescribed: ${i.qty?E(i.qty):'no quantity'} | Usable stock: ${x.k?x.u:'not tracked'}</div>${al.m[k].length?`<div class="er2" style="margin:4px 0"><b>Allergy warning:</b> ${E(algMsg(al.m[k],i.drug))} Check with the doctor before giving it.</div>`:''}<div class="fm" style="margin-top:8px;grid-template-columns:1fr"><div><label>Action</label><select id="dz${k}" onchange="rxDspChg(${k})"><option value="given"${def==='given'?' selected':''}>${i.qty?'Give full quantity':'Give'}</option><option value="partial"${def==='partial'?' selected':''}>Give partial quantity</option><option value="none"${def==='none'?' selected':''}>Not available</option></select></div><div id="dqw${k}" style="display:${def==='partial'?'block':'none'}"><label>Quantity given</label><input id="dq${k}" type="number" min="1" value="${def==='partial'&&x.u>0?x.u:''}"></div><div><label>Note for the doctor (optional)</label><input id="dn${k}" placeholder="e.g. out of stock, advise to buy outside" autocomplete="off"></div></div></div>`}).join('');

}
const rxDspChg=k=>{$('dqw'+k).style.display=$('dz'+k).value==='partial'?'block':'none'};
function rxDspGo(id){
  const r=RX.find(x=>x.id===id),er=$('dze'),res=[];if(!r)return;
  for(let k=0;k<(r.items||[]).length;k++){
    const i=r.items[k],x=rxLn(i),st=$('dz'+k).value,note=$('dn'+k).value.trim();let g=null;
    if(st==='given'){g=Number(i.qty)||null}
    else if(st==='partial'){g=Number($('dq'+k).value);if(!(g>=1))return er.textContent='Enter the quantity given for '+i.drug+'.';if(i.qty&&g>=Number(i.qty))return er.textContent='For '+i.drug+', the partial quantity must be less than '+i.qty+'. Choose Give full quantity instead.'}
    else g=0;
    if(x.k&&g>x.u)return er.textContent='Only '+x.u+' of '+i.drug+' can be used from stock.';
    res.push({st,given:g,note})
  }
  rxFinish(id,res)
}

function bid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function bList(v){if(Array.isArray(v.batches))return v.batches.filter(b=>b.qty>0);return v.qty>0?[{id:'legacy',qty:v.qty,exp:v.exp||'',d:'',src:'Earlier stock'}]:[]}
function bSort(bs){return bs.slice().sort((a,b)=>(a.exp||'9999-99-99').localeCompare(b.exp||'9999-99-99'))}
function bUse(v){const t=today();return bList(v).filter(b=>!b.exp||b.exp>=t).reduce((n,b)=>n+b.qty,0)}
function bExpQ(v){const t=today();return bList(v).filter(b=>b.exp&&b.exp<t).reduce((n,b)=>n+b.qty,0)}
function bPack(bs){bs=bSort(bs.filter(b=>b.qty>0));return{batches:bs,qty:bs.reduce((n,b)=>n+b.qty,0),exp:bs.map(b=>b.exp).filter(Boolean)[0]||''}}
function bTake(bs,n){const t=today(),o=bSort(bs).map(b=>({...b}));for(const b of o){if(n<=0)break;if(b.exp&&b.exp<t)continue;const u=Math.min(b.qty,n);b.qty-=u;n-=u}return o}
function stRows(id,v){
  const t=today(),bs=bSort(bList(v)),rs=bs.length>1?' rowspan="'+bs.length+'"':'';
  const tg=stTags(v).map(x=>`<span class="tg wa">${x}</span>`).join(' ')||'<span class="tg ok">OK</span>';
  const head=`<td${rs}>${E(v.name)}</td><td${rs}>${bUse(v)}${bExpQ(v)?' <small style="color:var(--mu)">(+'+bExpQ(v)+' expired)</small>':''}</td>`;
  const tail=`<td${rs}>${tg}</td><td${rs}><button class="bt g" onclick="siOpen('${id}')">Stock in</button> <button class="bt g" onclick="saOpen('${id}')">Adjust</button> <button class="bt g" onclick="stFill('${id}')">Edit</button></td>`;
  const cells=b=>b?`<td>${b.qty}</td><td>${b.exp?E(b.exp):'No expiry'}${b.exp&&b.exp<t?' <span class="tg er">Expired</span>':''}</td><td>${b.d?E(b.d):'-'}</td>`:'<td>-</td><td>-</td><td>-</td>';
  return bs.length?bs.map((b,n)=>'<tr>'+(n?'':head)+cells(b)+(n?'':tail)+'</tr>').join(''):'<tr>'+head+cells(null)+tail+'</tr>'
}
const stTags=v=>{const t=today(),soon=new Date(Date.now()+60*864e5).toLocaleDateString('en-CA'),o=[],bs=bList(v);if(bs.some(b=>b.exp&&b.exp<t))o.push('Expired');else if(bs.some(b=>b.exp&&b.exp<=soon))o.push('Expires soon');if(bUse(v)<=(typeof v.low==='number'?v.low:10))o.push('Low');return o};
const skey=n=>String(n).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const phg=()=>`<h2 style="margin-top:0">Pharmacy</h2>${stCard('pharmacy')}<div class="cd ov"><h3 style="margin-top:0">Prescriptions to dispense</h3><div id="phl">Loading...</div></div><div class="cd"><h3 style="margin-top:0">Stock</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="stq" placeholder="Search medicine" oninput="stSearch(this.value)" autocomplete="off" style="max-width:260px"><span id="stfb"></span><button class="bt" style="margin-left:auto" onclick="stAdd()">+ Add medicine</button></div><div class="ov" id="stl" style="margin-top:12px"></div></div><div class="cd ov"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h3 style="margin:0">Stock log</h3><span id="slf"></span></div><div id="sih">Loading...</div></div>`;

async function lbPrep(f){
  const MAX=5*1024*1024;
  if(f.type==='application/pdf'){if(f.size>MAX)throw new Error('The PDF is larger than 5 MB.');return{blob:f,name:f.name,type:'application/pdf'}}
  if(!/^image\//.test(f.type))throw new Error('Only photos and PDF files can be attached.');
  let bmp;try{bmp=await createImageBitmap(f)}catch(x){throw new Error('This photo could not be read. Try a JPEG, PNG or PDF.')}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  if(!blob||blob.size>MAX)throw new Error('The photo is too large.');
  return{blob,name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg'}
}

async function imGive(id,k){
  const v=VAX.find(x=>x[0]===k),p=P.find(x=>x.id===id),sk=vxKey(k),vn=(VXS.find(x=>x[0]===sk)||[0,v[1]])[1];

  er.textContent='';
  const tracked=!VSE&&VS[sk];
  if(tracked&&bUse(VS[sk])<=0&&!await sConfirm('There is no usable '+vn+' in the vaccine stock. Record the vaccine anyway? The stock will not change.','No stock recorded','Record anyway',0))return;
  const rec={pid:id,pname:pn(p),vax:k,label:v[1],d,by:U.uid,byName:U.name};
  let used=false,ss=null;
  try{
    await runTransaction(db,async tx=>{
      used=false;ss=null;
      const ir=doc(db,'immunizations',id+'_'+k),isn=await tx.get(ir);if(isn.exists())throw{code:'dup'};
      let sr=null,ssn=null;
      if(!VSE){sr=doc(db,'vxstock',sk);ssn=await tx.get(sr)}
      tx.set(ir,{...rec,at:serverTimestamp()});
      if(ssn&&ssn.exists()){
        const cur=ssn.data();
        if(bUse(cur)>=1){
          const np=bPack(bTake(bList(cur),1));
          tx.update(sr,{...np,at:serverTimestamp()});
          tx.set(doc(collection(db,'vxlog')),{key:sk,name:cur.name,type:'out',reason:'Given: '+v[1],note:'',qty:-1,after:np.qty,ref:id+'_'+k,d:today(),by:U.uid,byName:U.name,at:serverTimestamp()});
          ss={...cur,...np};used=true
        }
      }
    });
    IM[id+'_'+k]={d};if(used)VS[sk]=ss;await lg('Immunization '+k+' '+id);
    sDone(used?'The vaccine was recorded. 1 dose of '+vn+' was taken from stock ('+bUse(ss)+' left).':'The vaccine was recorded.','Vaccine recorded');
    imRender();vxRender();if(used)loadVl()
  }catch(x){
    if(x.code==='dup'){er.textContent='This vaccine was already recorded for this child.';loadIm();return}

      try{await setDoc(doc(db,'immunizations',id+'_'+k),{...rec,at:serverTimestamp()});IM[id+'_'+k]={d};await lg('Immunization '+k+' '+id);imRender();sAlert('The vaccine was recorded, but the vaccine stock was not updated. Publish the latest firestore.rules first.');return}catch(y){}
    }
    er.textContent=x.code==='permission-denied'?'You do not have permission to record vaccines.':'Could not save. Check your connection.'
  }
}

function rcChronic(){
  const o=[];if(!RC)return o;
  const rules=[['htn','Hypertension',/^I1[0-5]/,/hypertens|\bhtn\b/i],['dm','Diabetes',/^E1[0-4]/,/diabet|\bdm\b/i]];
  const last={};
  RC.vs.forEach(v=>{
    if(!v.pid||!v.d)return;
    const txt=(v.dx||'')+' '+(v.cc||'');
    rules.forEach(([id,,ic,rx])=>{
      if((v.icd||[]).some(c=>c&&ic.test(c.code||''))||rx.test(txt)){const k=v.pid+'|'+id;if(!last[k]||v.d>last[k])last[k]=v.d}
    })
  });
  const byP={};
  Object.entries(last).forEach(([k,d])=>{const [pid,id]=k.split('|');(byP[pid]=byP[pid]||[]).push([id,d])});
  Object.entries(byP).forEach(([pid,l])=>{
    const p=P.find(x=>x.id===pid);if(!p)return;
    const conds=l.map(([id,d])=>({n:rules.find(r=>r[0]===id)[1],d}));
    const lastSeen=conds.map(c=>c.d).sort().pop(),due=rcAddDays(lastSeen,RC_CHRONIC_DAYS);
    if(fuDays(due)>RC_LOOKAHEAD_DAYS)return;
    o.push({k:'h',key:'h',pid,name:pn(p),due,why:conds.map(c=>c.n).join(' + ')+' check-up (last seen '+lastSeen+')'})
  });
  return o
}
function fuItems(){

  (PN||[]).filter(x=>x.status==='active'&&x.nv).forEach(x=>o.push({k:'p',key:'p'+String(x.id).replace(/[^A-Za-z0-9_]/g,'_'),id:x.id,pid:x.pid,name:x.pname,due:x.nv,why:'check-up'}));
  rcVaccines().forEach(x=>o.push(x));rcChronic().forEach(x=>o.push(x));

const pnTri=l=>{const w=Math.floor(dayDiff(today(),l)/7);return w<14?'1st trimester':w<28?'2nd trimester':'3rd trimester'};
const pnElig=p=>p.sex==='F'&&ageY(p.dob)>=10&&ageY(p.dob)<=60;
const pnEddTxt=n=>n<0?(-n)+' day'+(n===-1?'':'s')+' past due date':n===0?'Due today':'In '+n+' day'+(n===1?'':'s');
async function pnFetch(){
  try{const s=await getDocs(collection(db,'prenatal'));PN=s.docs.map(d=>({id:d.id,...d.data()}));PN.forEach(x=>{PNM[x.id]=x});PNE=false;PNEC=''}
  catch(e){PNE=true;PNEC=e.code||'';if(PN===null)PN=[]}
}

// Risk flags: age at the last period, the latest blood pressure, and the factors ticked at registration.
function pnAlerts(x){
  const p=P.find(y=>y.id===x.pid),o=[];
  if(p&&p.dob&&x.lmp){const a=ageAt(p.dob,x.lmp);if(a<18)o.push(['Age under 18','wa']);else if(a>=35)o.push(['Age 35 or older','wa'])}
  if(x.lbs>=140||x.lbd>=90)o.push(['BP '+x.lbs+'/'+x.lbd,'er']);
  (x.risk||[]).forEach(r=>o.push([r,'wa']));
  return o
}
function pnFilter(){
  const s=PNQ.toLowerCase();
  return (PN||[]).filter(x=>{
    const act=x.status==='active',p=P.find(y=>y.id===x.pid);
    if(PNF==='closed'){if(act)return false}
    else{if(!act)return false;
      if(PNF==='risk'&&!pnAlerts(x).length)return false;
      if(PNF==='due'&&fuDays(x.edd)>30)return false;
      if(PNF==='late'&&!(x.nv&&fuDays(x.nv)<0))return false}
    if(PNB&&(!p||p.br!==PNB))return false;
    return !s||(x.pname||'').toLowerCase().includes(s)
  }).sort((a,b)=>PNF==='closed'?(b.outDate||'').localeCompare(a.outDate||''):(a.edd||'').localeCompare(b.edd||''))
}
function pnRows(){
  const l=pnFilter(),can=CROLES.includes(U.role),cl=PNF==='closed';
  if(!l.length)return `<tr><td colspan="6">${cl?'No closed pregnancies.':'No matching pregnancies.'}</td></tr>`;
  return l.map(x=>{
    const p=P.find(y=>y.id===x.pid),al=pnAlerts(x),eg=fuDays(x.edd);
    const tags=al.slice(0,3).map(a=>tgh(E(a[0]),a[1])).join(' ')+(al.length>3?' <small style="color:var(--mu)">+'+(al.length-3)+' more</small>':'');
    const mid=cl?E(x.outcome||'Closed')+'<small style="display:block;color:var(--mu)">'+E(x.outDate||'')+'</small>':E(pnAog(x.lmp))+'<small style="display:block;color:var(--mu)">'+pnTri(x.lmp)+'</small>';
    const edd=E(x.edd)+(cl?'':`<small style="display:block;color:${eg<0?'var(--er)':'var(--mu)'}">${pnEddTxt(eg)}</small>`);
    const vis=cl?'':`<small style="color:var(--mu)">Last: ${E(x.lastVd||'none')}</small><br>${x.nv?'Next: '+E(x.nv)+(fuDays(x.nv)<0?' '+tgh('Overdue','er'):''):'<span style="color:var(--mu)">No next visit set</span>'}`;
    return `<tr><td><a href="#" onclick="view('${E(x.pid)}');return false">${E(x.pname)}</a><small style="display:block;color:var(--mu)">${E(p?age(p.dob)+' | '+p.pu+', '+p.br:'')}</small></td><td>${mid}</td><td>${edd}</td><td>${tags||'<span style="color:var(--mu)">None</span>'}</td><td>${vis}</td><td style="white-space:nowrap">${can&&!cl?`<button class="bt g" onclick="pnVisit('${x.id}')">Add visit</button> <button class="bt g" onclick="pnClose('${x.id}')">Close</button>`:''}</td></tr>`
  }).join('')
}

  +`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"><select style="width:auto" onchange="pnSetB(this.value)"><option value="">All barangays</option>${brs.map(b=>`<option ${PNB===b?'selected':''}>${E(b)}</option>`).join('')}</select><input placeholder="Search patient" value="${E(PNQ)}" oninput="pnSq(this.value)" style="max-width:220px"><button class="bt g" style="margin-left:auto" onclick="pnPrint()">Print list</button></div>`
  +`<div class="ov"><table><thead><tr><th>Patient</th><th>${PNF==='closed'?'Outcome':'Age of gestation'}</th><th>Due date</th><th>Risk</th><th>${PNF==='closed'?'':'Check-ups'}</th><th></th></tr></thead><tbody id="pnt">${pnRows()}</tbody></table></div></div>`

function pnEdd(){const v=$('pf1').value,el=$('pf2');if(el)el.textContent=/^\d{4}-\d{2}-\d{2}$/.test(v)?longD(addD(v,280)):'-'}
function pnRefresh(pid0){if(pg==='pn'||pg==='fu')lvScroll(R);if(pg==='prof'&&pid===pid0)loadPnH(pid0)}
async function pnSave(pid0,prid){
  const p=P.find(x=>x.id===pid0),er=$('pfe'),e=s=>{er.textContent=s};if(!p)return;
  const lmp=$('pf1').value,gs=$('pf3').value.trim(),ps=$('pf4').value.trim(),note=$('pf5').value.trim(),nv=$('pf6')?$('pf6').value:'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(lmp)||isNaN(new Date(lmp)))return e('Enter the first day of the last period.');
  if(lmp>today())return e('The last period cannot be in the future.');
  if(dayDiff(today(),lmp)>294)return e('That date is more than 42 weeks ago. Check the date.');
  if(ageAt(p.dob,lmp)<10)return e('Check the date: the patient was under 10 years old then.');
  const g=gs===''?null:parseInt(gs,10),pa=ps===''?null:parseInt(ps,10);
  if((g!==null&&!(g>=1&&g<=20))||(pa!==null&&!(pa>=0&&pa<=20)))return e('Gravida must be 1 to 20 and para 0 to 20, or leave them blank.');
  if(g!==null&&pa!==null&&pa>=g)return e('Para must be less than gravida.');
  if(nv&&nv<=today())return e('Pick a check-up date after today, or clear it.');
  if(!prid&&Object.values(PNM).some(x=>x.pid===pid0&&x.status==='active'))return e('This patient already has an active pregnancy.');
  const risk=PNRISK.filter((r,i)=>$('pr'+i).checked),edd=addD(lmp,280);
  fmBusy(true);
  try{
    if(prid){await updateDoc(doc(db,'prenatal',prid),{lmp,edd,g,pa,risk,riskNote:note,updBy:U.name,updAt:serverTimestamp()});if(PNM[prid])Object.assign(PNM[prid],{lmp,edd,g,pa,risk,riskNote:note});await lg('Updated pregnancy '+pid0)}
    else{const d={pid:pid0,pname:pn(p),lmp,edd,g,pa,risk,riskNote:note,status:'active',nv,lastVd:'',by:U.uid,byName:U.name},r=await addDoc(collection(db,'prenatal'),{...d,at:serverTimestamp()});PNM[r.id]={id:r.id,...d};if(PN)PN.push(PNM[r.id]);await lg('Registered pregnancy '+pid0)}
    fmClose();pnRefresh(pid0);sDone('The pregnancy was saved.','Saved')
  }catch(ex){fmBusy(false);e(ex.code==='permission-denied'?'You do not have permission to record pregnancies. Publish the latest firestore.rules first.':'Could not save. Check your connection.')}
}

   'Save visit',`pnVisitSave('${prid}')`)

function pnNv(n){const el=$('pv7');if(el)el.value=addD(today(),n)}
async function pnVisitSave(prid){
  const x=PNM[prid],er=$('pve'),e=s=>{er.textContent=s};if(!x)return;
  const num=i=>{const v=$(i).value.trim();return v===''?null:Number(v)},d=$('pv0').value,bps=num('pv1'),bpd=num('pv2'),wt=num('pv3'),fh=num('pv4'),fht=num('pv5'),notes=$('pv6').value.trim(),nv=$('pv7').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d))||d>today()||d<x.lmp)return e('Enter a valid visit date (not in the future, not before the last period).');
  if((bps===null)!==(bpd===null))return e('Enter both blood pressure numbers, or leave both blank.');
  const bad=(v,a,b)=>v!==null&&!(v>=a&&v<=b);
  if(bad(bps,50,260)||bad(bpd,30,160)||(bps!==null&&bps<=bpd))return e('Check the blood pressure values.');
  if(bad(wt,20,200)||bad(fh,5,50)||bad(fht,60,220))return e('Check the weight, fundal height or fetal heart tone values.');
  if(nv&&nv<=today())return e('Pick a check-up date after today, or clear it.');
  if(bps===null&&wt===null&&fh===null&&fht===null&&!notes)return e('Enter at least one finding or a note.');
  fmBusy(true);
  try{
    const b=writeBatch(db),latest=d>=(x.lastVd||''),up=latest?{lastVd:d,nv,...(bps!==null?{lbs:bps,lbd:bpd}:{})}:{};
    // Only the newest visit updates the summary on the pregnancy (last visit, next check-up, latest BP); an older entry is just added to the log.
    b.set(doc(collection(db,'prenatalVisits')),{prid,pid:x.pid,pname:x.pname,d,aog:Math.floor(dayDiff(d,x.lmp)/7),bps,bpd,wt,fh,fht,notes,nv,by:U.uid,byName:U.name,at:serverTimestamp()});
    if(latest)b.update(doc(db,'prenatal',prid),{...up,updBy:U.name,updAt:serverTimestamp()});
    await b.commit();
    Object.assign(x,up);await lg('Prenatal visit '+x.pid+' '+d);fmClose();pnRefresh(x.pid);sDone('The visit was saved.','Saved')
  }catch(ex){fmBusy(false);e(ex.code==='permission-denied'?'You do not have permission to record visits. Publish the latest firestore.rules first.':'Could not save. Check your connection.')}
}
